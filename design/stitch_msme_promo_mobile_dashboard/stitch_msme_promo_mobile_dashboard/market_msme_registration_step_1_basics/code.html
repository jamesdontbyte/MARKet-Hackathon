      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-on-primary-container">
<!-- Shared TopAppBar Container (Linear/Task onboarding layout: BottomNavBar suppressed) -->

<!-- Main Mobile Canvas -->
<main class="w-full max-w-md mx-auto px-margin-mobile pb-28 flex-1 flex flex-col gap-5 p-5">
<!-- Hero / Orientation Header with Dynamic Micro-Card -->

<!-- Horizontal Step Wizard Progress Component -->
<div class="bg-surface-container-lowest p-3.5 rounded-2xl border border-surface-container-high custom-shadow">
<div class="flex items-center justify-between relative">
<!-- Connecting baseline track -->
<div class="absolute left-6 right-6 top-4 h-[2px] bg-surface-container-high -z-0"></div>
<div class="absolute left-6 w-[28%] top-4 h-[2px] bg-primary-container -z-0 transition-all duration-300"></div>
<!-- Step 1 (Active) -->
<div class="flex flex-col items-center gap-1 z-10">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-surface flex items-center justify-center font-label-md text-label-md ring-4 ring-primary-container/20 font-bold">
            1
          </div>
<span class="font-label-sm text-label-sm text-primary font-bold">Basics</span>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center gap-1 z-10">
<div class="w-8 h-8 rounded-full bg-surface-container text-secondary flex items-center justify-center font-label-md text-label-md">
            2
          </div>
<span class="font-label-sm text-label-sm text-secondary">Business</span>
</div>
<!-- Step 3 -->
<div class="flex flex-col items-center gap-1 z-10">
<div class="w-8 h-8 rounded-full bg-surface-container text-secondary flex items-center justify-center font-label-md text-label-md">
            3
          </div>
<span class="font-label-sm text-label-sm text-secondary">Permits</span>
</div>
<!-- Step 4 -->
<div class="flex flex-col items-center gap-1 z-10">
<div class="w-8 h-8 rounded-full bg-surface-container text-secondary flex items-center justify-center font-label-md text-label-md">
            4
          </div>
<span class="font-label-sm text-label-sm text-secondary">Review</span>
</div>
</div>
</div>
<!-- Onboarding Form -->
<form class="flex flex-col gap-5" onsubmit="event.preventDefault();">
<!-- Section 1: Account & Owner Credentials -->
<section class="bg-surface-container-lowest rounded-2xl p-5 border border-surface-container-high custom-shadow flex flex-col gap-4"><div class="flex items-center justify-between pb-2 border-b border-surface-container-high"><div class="flex items-center gap-2"><span class="material-symbols-outlined text-primary text-[20px]">person</span><h2 class="font-headline-sm text-headline-sm text-on-surface">Personal Information</h2></div></div><div class="flex flex-col gap-1.5"><label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1" for="fullName">Full Name (Owner / Authorized Representative)</label><div class="relative"><input class="w-full h-12 px-3.5 rounded-[10px] bg-surface-container-lowest border border-outline-variant text-on-surface placeholder:text-outline text-body-md font-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/40 outline-none transition" id="fullName" name="fullName" placeholder="First Name, Middle Name, Last Name" required="" type="text" value="Maria Santos"><span class="material-symbols-outlined absolute right-3.5 top-1/2 -translate-y-1/2 text-primary-tint text-[18px]">person</span></div></div><div class="flex flex-col gap-1.5"><label class="font-label-md text-label-md text-on-surface-variant" for="dob">Date of Birth</label><input class="w-full h-12 px-3.5 rounded-[10px] bg-surface-container-lowest border border-outline-variant text-on-surface placeholder:text-outline text-body-md font-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/40 outline-none transition" id="dob" name="dob" required="" type="date" value="1990-05-14"></div><div class="flex flex-col gap-1.5"><label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="mobileNumber"><span class="">Mobile Number</span><span class="text-tertiary font-label-sm text-label-sm">SMS verification required</span></label><div class="flex gap-2"><div class="flex items-center justify-center px-3 h-12 rounded-[10px] bg-surface-container border border-outline-variant font-label-lg text-label-lg text-on-surface select-none">🇵🇭 +63</div><input class="flex-1 h-12 px-3.5 rounded-[10px] bg-surface-container-lowest border border-outline-variant text-on-surface placeholder:text-outline text-body-md font-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/40 outline-none transition" id="mobileNumber" name="mobileNumber" placeholder="9XX XXX XXXX" required="" type="tel" value="917 842 5521"></div><div class="mt-1 flex items-center justify-between bg-surface-container-low p-2.5 rounded-xl border border-outline-variant/30"><div class="flex items-center gap-2"><span class="material-symbols-outlined text-primary text-[18px]">verified_user</span><span class="font-label-sm text-label-sm text-on-surface-variant">Instant 6-digit passcode</span></div><button class="bg-primary-container hover:bg-primary-fixed-dim font-label-md text-label-md px-3.5 py-1.5 rounded-full font-semibold transition active:scale-[0.97] flex items-center gap-1 shadow-sm text-on-primary" id="otpButton" onclick="triggerOtp()" type="button"><span class="material-symbols-outlined text-[15px]">send</span><span id="otpText" class="">Verify via SMS</span></button></div></div><div class="flex flex-col gap-1.5"><label class="font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label><div class="relative"><input class="w-full h-12 px-3.5 rounded-[10px] bg-surface-container-lowest border border-outline-variant text-on-surface placeholder:text-outline text-body-md font-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/40 outline-none transition" id="email" name="email" placeholder="name@business.com" required="" type="email" value="maria.santos@kapeta.ph"><span class="material-symbols-outlined absolute right-3.5 top-1/2 -translate-y-1/2 text-outline text-[18px]">mail</span></div></div><div class="flex flex-col gap-1.5"><label class="font-label-md text-label-md text-on-surface-variant" for="passwordInput">Account Password</label><div class="relative"><input class="w-full h-12 pl-3.5 pr-11 rounded-[10px] bg-surface-container-lowest border border-outline-variant text-on-surface placeholder:text-outline text-body-md font-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/40 outline-none transition" id="passwordInput" name="password" required="" type="password" value="MarketCafe2025#"><button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition p-1" onclick="togglePassword()" type="button"><span class="material-symbols-outlined text-[20px]" id="passwordIcon">visibility</span></button></div><p class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-1 mt-0.5"><span class="material-symbols-outlined text-[14px] text-tertiary">check_circle</span>Must include at least 8 characters, 1 number, and 1 symbol</p></div><div class="flex flex-col gap-1.5"><label class="font-label-md text-label-md text-on-surface-variant" for="confirmPasswordInput">Confirm Password</label><div class="relative"><input class="w-full h-12 px-3.5 rounded-[10px] bg-surface-container-lowest border border-outline-variant text-on-surface placeholder:text-outline text-body-md font-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/40 outline-none transition" id="confirmPasswordInput" name="confirmPassword" required="" type="password" value="MarketCafe2025#"><span class="material-symbols-outlined absolute right-3.5 top-1/2 -translate-y-1/2 text-primary-tint text-[18px]">lock_reset</span></div></div></section>
<!-- Section 2: Business Information -->

</form>
</main>
<!-- Sticky Bottom Bar Anchor (Focused Linear Wizard) -->
<footer class="fixed bottom-0 left-0 right-0 z-50 bg-surface/95 backdrop-blur-md border-t border-outline-variant/30 py-3 px-margin-mobile">
<div class="max-w-md mx-auto flex items-center gap-3">

<button class="flex-1 h-12 bg-primary-container hover:bg-primary-fixed-dim font-label-lg text-label-lg font-bold rounded-xl transition duration-150 active:scale-[0.98] flex items-center justify-center gap-2 custom-shadow text-on-primary w-full" onclick="proceedNext()" type="button"><span class="">Continue to Business Information</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span></button>
</div>
</footer>
<script>
    // Password toggle
    function togglePassword() {
      const passwordInput = document.getElementById('passwordInput');
      const passwordIcon = document.getElementById('passwordIcon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        passwordIcon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        passwordIcon.textContent = 'visibility';
      }
    }

    // Category chip selection
    function selectCategory(selectedBtn) {
      const chips = document.querySelectorAll('.category-chip');
      chips.forEach(chip => {
        chip.className = 'category-chip px-3.5 py-2 rounded-full border text-label-md font-label-md flex items-center gap-1.5 transition active:scale-95 bg-surface-container-low border-surface-container-high text-secondary hover:bg-surface-container';
      });
      selectedBtn.className = 'category-chip px-3.5 py-2 rounded-full border text-label-md font-label-md flex items-center gap-1.5 transition active:scale-95 bg-primary-container/20 border-primary-container text-primary font-semibold';
    }

    // Character counter for textarea
    function updateCount(textarea) {
      const counter = document.getElementById('charCounter');
      counter.textContent = `${textarea.value.length} / 240`;
    }

    // OTP Simulated trigger
    function triggerOtp() {
      const btn = document.getElementById('otpButton');
      const txt = document.getElementById('otpText');
      btn.classList.remove('bg-primary-container');
      btn.classList.add('bg-surface-container', 'text-tertiary');
      txt.textContent = 'OTP Sent (45s)';
      btn.disabled = true;
      setTimeout(() => {
        txt.textContent = 'Verified ✓';
        btn.classList.add('text-primary');
      }, 2000);
    }

    // Linear submission feedback
    function proceedNext() {
      const btn = event.currentTarget;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span> Saving Basics...';
      setTimeout(() => {
        btn.innerHTML = '<span>Proceeding to Step 2</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span>';
      }, 700);
    }
  </script>
