<!-- Interactive Client-side Script for Category Toggling -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.cat-card');
      const counter = document.getElementById('selected-counter');
      const continueBtn = document.getElementById('continue-btn');

      function updateCounter() {
        const selectedCount = document.querySelectorAll('.cat-card.border-primary-container').length;
        counter.textContent = `${selectedCount} selected`;
      }

      cards.forEach(card => {
        card.addEventListener('click', () => {
          const isSelected = card.classList.contains('border-primary-container');
          const iconWrapper = card.querySelector('.w-10');
          const checkBox = card.querySelector('.check-box');
          const checkIcon = checkBox.querySelector('span');

          if (isSelected) {
            // Unselect
            card.classList.remove('border-2', 'border-primary-container', 'bg-surface-container-low/50');
            card.classList.add('border', 'border-outline-variant/40', 'bg-white');

            iconWrapper.classList.remove('bg-primary-container', 'text-on-surface');
            iconWrapper.classList.add('bg-surface-container-low', 'text-primary');

            checkBox.classList.remove('bg-primary-container', 'text-[#0b1c30]');
            checkBox.classList.add('border', 'border-outline-variant/50', 'bg-white', 'text-transparent');
          } else {
            // Select
            card.classList.remove('border', 'border-outline-variant/40', 'bg-white');
            card.classList.add('border-2', 'border-primary-container', 'bg-surface-container-low/50');

            iconWrapper.classList.remove('bg-surface-container-low', 'text-primary');
            iconWrapper.classList.add('bg-primary-container', 'text-on-surface');

            checkBox.classList.remove('border', 'border-outline-variant/50', 'bg-white', 'text-transparent');
            checkBox.classList.add('bg-primary-container', 'text-[#0b1c30]');
          }
          updateCounter();
        });
      });

      // Visual tap response on continue button
      continueBtn.addEventListener('click', () => {
        continueBtn.innerHTML = `
          <span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>
          <span>Personalizing feed...</span>
        `;
        setTimeout(() => {
          continueBtn.innerHTML = `
            <span>Continue to Dashboard</span>
            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
          `;
        }, 1200);
      });
    });
  </script>
